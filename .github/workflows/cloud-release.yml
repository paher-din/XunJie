# Builds the Linux production runtime artifact for the shared host and publishes
# it as a GitHub Release (tag cloud-<commit>). Build success never deploys by
# itself: the server-side deploy tooling downloads, verifies and switches.
name: cloud-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Candidate integration runs must not cancel main publications. Never cancel
  # a publication between its immutable artifact tag and the visible Release.
  group: cloud-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-runtime-artifact:
    concurrency:
      group: cloud-artifact-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            apps/student/package-lock.json
            apps/teaching/package-lock.json
      - name: Build the student interface
        working-directory: apps/student
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build
      - name: Install teaching production dependencies
        working-directory: apps/teaching
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Assemble the verifiable runtime artifact
        run: |
          node tools/i0-cloud/build-runtime-artifact.mjs \
            --source . \
            --output "$RUNNER_TEMP/artifact" \
            --commit "$GITHUB_SHA" \
            --git-tree "$(git rev-parse 'HEAD^{tree}')" \
            --expected-platform linux-x64 \
            --expected-node-version v24.21.0 \
            | tee "$RUNNER_TEMP/artifact-summary.json"
          test "$(node -e 'process.stdout.write(require(process.env.RUNNER_TEMP + "/artifact-summary.json").status)')" = built
      - name: Publish an immutable artifact and its bound release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: cloud-${{ github.sha }}
        run: |
          # An already-bound published release is immutable, including on re-run.
          if gh release view "$TAG" --json isDraft,body > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if node -e 'const r=require(process.env.RUNNER_TEMP+"/existing-release.json");process.exit(!r.isDraft && r.body.includes("<!-- xunjie-artifact-v1 ") ? 0 : 1)'; then
              exit 0
            fi
          fi
          manifest_sha=$(sha256sum "$RUNNER_TEMP/artifact/manifest.json" | cut -d ' ' -f 1)
          artifact_tag="cloud-artifact-$manifest_sha"
          git config user.name "cloud-release-bot"
          git config user.email "actions@github.com"
          git checkout --orphan cloud-artifact-candidate
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/artifact/manifest.json" "$RUNNER_TEMP/artifact/runtime.tar.gz" .
          git add manifest.json runtime.tar.gz
          git commit -m "Cloud runtime artifact for $GITHUB_SHA"
          artifact_commit=$(git rev-parse HEAD)
          git tag "$artifact_tag"
          # No force-push or moving branch is used to deliver artifact bytes.
          git push origin "refs/tags/$artifact_tag"
          export ARTIFACT_COMMIT="$artifact_commit" MANIFEST_SHA256="$manifest_sha"
          node -e '
            const fs=require("node:fs");
            const summary=require(process.env.RUNNER_TEMP+"/artifact-summary.json");
            const binding={commit:summary.commit,artifactCommit:process.env.ARTIFACT_COMMIT,
              manifestSha256:process.env.MANIFEST_SHA256,artifactSha256:summary.artifactSha256};
            fs.writeFileSync(process.env.RUNNER_TEMP+"/release-notes.md",
              "Runtime artifact for " + summary.commit + "\n\n" +
              "<!-- xunjie-artifact-v1 " + JSON.stringify(binding) + " -->\n");
          '
          # Legacy unbound releases/drafts may be replaced once during migration.
          # The content-addressed artifact tag is already reachable before this.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "$RUNNER_TEMP/artifact/manifest.json" \
            "$RUNNER_TEMP/artifact/runtime.tar.gz" \
            --target "$GITHUB_SHA" --draft --title "Cloud runtime $GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --draft=false
      - name: Prune superseded artifact releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep recent releases and protect both main and integration HEADs. Never
          # delete a Release currently needed for either branch's HEAD.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          git ls-remote origin refs/heads/main refs/heads/codex/development-collaboration-integration > "$RUNNER_TEMP/protected-heads.txt"
          node -e '
            const fs=require("node:fs");const cp=require("node:child_process");
            const releases=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/releases.json","utf8")).flat();
            const heads=new Set(fs.readFileSync(process.env.RUNNER_TEMP+"/protected-heads.txt","utf8").trim().split(/\n/).map(x=>x.split(/\s/)[0]));
            let keep=0;
            for(const release of releases.filter(r=>!r.draft && /^cloud-[0-9a-f]{40}$/.test(r.tag_name))){
              if(heads.has(release.tag_name.slice(6)) || keep++<5)continue;
              cp.execFileSync("gh",["release","delete",release.tag_name,"--yes","--cleanup-tag"]);
              const match=/<!-- xunjie-artifact-v1 (\{[^\n]+\}) -->/.exec(release.body||"");
              if(match){const b=JSON.parse(match[1]);if(/^[0-9a-f]{64}$/.test(b.manifestSha256))
                cp.execFileSync("git",["push","origin",":refs/tags/cloud-artifact-"+b.manifestSha256]);}
            }
          '
