name: workspace-verification

on:
  workflow_call:
    outputs:
      build-artifact:
        description: Build outputs verified by every test group in this run
        value: ${{ jobs.prepare.outputs.build-artifact }}

permissions:
  contents: read

jobs:
  agent-runtime-native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.build-artifact }}
          path: ${{ runner.temp }}/build/
      - run: node scripts/ci-build-artifact.mjs restore "$RUNNER_TEMP/build"
      - name: Install and verify the product native isolation entry
        run: |
          native_node_root="$(dirname "$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")")"
          sudo install -d -m 0755 /var/lib/xunjie
          sudo sh scripts/install-linux-native-entry.sh \
            --user "$(id -un)" --node-root "$native_node_root"
      - name: Prepare pinned PostgreSQL
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { cachedArchive, unpackArchive } from './scripts/package-product.mjs';
          const catalog = JSON.parse(await readFile('scripts/product-resources.json', 'utf8'));
          const resource = catalog.postgres.platforms['linux-x64'];
          const destination = join(process.env.RUNNER_TEMP, 'agent-postgres');
          const archive = await cachedArchive(join(process.env.RUNNER_TEMP, 'postgres-cache'), resource);
          await unpackArchive(archive, resource, destination);
          await appendFile(process.env.GITHUB_ENV, `XUNJIE_PRODUCT_POSTGRES_BIN=${join(destination, 'bin')}\n`);
          NODE
      - name: Verify Agent ownership, timeouts and task cancellation on real PostgreSQL
        run: >-
          node --test --test-concurrency=2
          packages/agent-runtime/test/loop.runtime.test.mjs
          packages/product-runtime/test/workspace-agent-tasks.runtime.test.mjs
          scripts/switch-agent-runtime-data.runtime.test.mjs
          apps/server/tests/native-channel-cancellation.runtime.test.mjs
          apps/server/tests/channel-executions.runtime.test.mjs
          scripts/pr226-regressions/repro-core-runtime.mjs
          scripts/pr226-regressions/repro-tool-timeout.mjs
          scripts/pr226-regressions/repro-call-cancellation.mjs
          scripts/pr226-regressions/repro-workspace-authority.mjs
          scripts/pr226-regressions/repro-capability-boundaries.mjs
          scripts/pr226-regressions/repro-model-context.mjs
          scripts/pr226-regressions/repro-real-gateway-boundaries.mjs
          scripts/pr226-regressions/repro-task-boundaries.mjs
          scripts/pr226-regressions/repro-cancellation-late.mjs
          scripts/pr226-regressions/repro-native-operation.mjs
          scripts/pr226-regressions/repro-migration-and-answer.mjs
          scripts/pr226-regressions/repro-capability-regressions.mjs
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build-artifact: build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run verify -- --group prepare
      - run: node scripts/ci-build-artifact.mjs pack "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build/
          retention-days: 7
  tests:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: unit, shard: '1/1' }
          - { group: server, shard: '1/4' }
          - { group: server, shard: '2/4' }
          - { group: server, shard: '3/4' }
          - { group: server, shard: '4/4' }
          - { group: tools, shard: '1/4' }
          - { group: tools, shard: '2/4' }
          - { group: tools, shard: '3/4' }
          - { group: tools, shard: '4/4' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.build-artifact }}
          path: ${{ runner.temp }}/build/
      - run: node scripts/ci-build-artifact.mjs restore "$RUNNER_TEMP/build"
      - name: Run the test group
        env:
          TEST_GROUP: ${{ matrix.group }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          args=(--group "$TEST_GROUP")
          if test "$TEST_GROUP" != unit; then args+=(--shard "$TEST_SHARD"); fi
          npm run verify -- "${args[@]}"
      - name: Check legacy HDL node ledger
        if: matrix.group == 'unit'
        run: |
          sudo install -d -m 0700 -o "$(id -un)" -g "$(id -gn)" /run/xunjie-dlc
          node --test apps/server/runner/alu-node.runtime.test.ts
