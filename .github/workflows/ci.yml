name: ci

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**/*.png'
      - 'docs/**/*.jpg'
      - 'docs/**/*.svg'
      - 'docs/**/*.pdf'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**/*.png'
      - 'docs/**/*.jpg'
      - 'docs/**/*.svg'
      - 'docs/**/*.pdf'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/cloud-release.yml
    with:
      build-artifact: ${{ needs.verify.outputs.build-artifact }}
