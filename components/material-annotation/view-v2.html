<html lang="zh-CN"><head><title>材料标注</title><style>
:root{color-scheme:light dark;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);background:var(--canvas)}
*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,1fr);height:100vh}
article,aside{padding:24px;overflow:auto}aside{border-left:1px solid var(--line)}h1,h2{font-size:17px;font-weight:600;line-height:1.5;margin:0 0 16px}
p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 16px;max-width:70ch}.muted{color:var(--muted);font-size:13px}
button,input,textarea{font:inherit;color:inherit}button{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--hover)}button:disabled{cursor:default;opacity:.6}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--canvas)}
label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:8px}.annotation{padding:16px 0;border-bottom:1px solid var(--line)}
blockquote{margin:0 0 12px;padding:8px 12px;background:var(--chip);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:10px}.error{color:var(--ink);background:var(--chip);padding:12px}::selection{background:var(--chip);color:var(--ink)}
mark.xj-mark{background:var(--chip);color:var(--ink);padding:0 1px;border-radius:3px;box-shadow:inset 0 -2px 0 var(--accent)}
#highlight-note{margin:0 0 16px;max-width:70ch}
@media(max-width:640px){main{grid-template-columns:1fr;height:auto}article,aside{padding:16px}aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body><main><article aria-label="开放材料"><h1 id="title">材料标注</h1><p id="highlight-note" class="muted" hidden></p><div id="materials"></div><button id="add" disabled>标注选中文字</button></article>
<aside aria-label="我的标注"><h2>我的标注</h2><p id="empty" class="muted">选中材料中的文字，记下你的理解或疑问。</p><p id="error" class="error" role="alert" hidden></p><div id="annotations"></div></aside></main>
<script>
(() => {
  const CODES = ['invalid-input', 'unsupported-version', 'capability-unavailable', 'forbidden', 'stale-connection', 'conflict', 'resource-unavailable', 'outcome-unknown'];
  let connection, port, contentId = null, state, initialized = false, blocked = false, prepared = false;
  let mode = null, markInstance = null, highlightReady = false, highlightId = null;
  const loadedGlobals = new Map();
  const pending = new Map();
  const area = () => document.querySelector('#materials');
  const marks = () => [...area().querySelectorAll('mark.xj-mark')];
  const bodyText = () => [...area().querySelectorAll('p')].map(item => item.textContent).join('\n');
  // Full-quote matching: no word splitting, no case or diacritic folding, no wildcards or synonyms.
  const markOptions = done => ({ className: 'xj-mark', accuracy: 'partially', separateWordSearch: false,
    caseSensitive: true, diacritics: false, acrossElements: true, ignoreJoiners: false, ignorePunctuation: [],
    wildcards: 'disabled', synonyms: {}, exclude: [], iframes: false, done });
  function request(method, payload, done) {
    const messageId = crypto.randomUUID();
    if (done) pending.set(messageId, done);
    port.postMessage({hostApiVersion:1,connectionId:connection.connectionId,instanceId:connection.instanceId,messageId,method,payload});
  }
  function call(method, payload, done) {
    return new Promise(resolve => request(method, payload, message => { done?.(message); resolve(message); }));
  }
  function error(text) { blocked = true; const el = document.querySelector('#error'); el.hidden = false; el.textContent = text;
    document.querySelector('#add').disabled = true; document.querySelectorAll('#annotations textarea').forEach(input => { input.readOnly = true; }); }
  function change() {
    const previous = contentId; contentId = crypto.randomUUID();
    return call('workspace.change', {operationId:crypto.randomUUID(), expectedContentId:previous, contentId, content:structuredClone(state)}, reply => {
      if (reply.error) error('本次标注尚未确认。请保留页面，可复制下方内容或导出当前标注后重新核对。');
    });
  }
  function addAnnotation(quote) {
    if (blocked || !state || !quote || !quote.trim() || quote.length > 4000 || state.annotations.length >= 100) return null;
    const item = {id:crypto.randomUUID(),quote,note:''};
    state.annotations.push(item); void change(); render();
    return item.id;
  }
  function setNote(id, note) {
    const item = state?.annotations.find(other => other.id === id);
    if (!item || blocked) return false;
    item.note = note; void change(); return true;
  }
  function unmark() { return new Promise(resolve => { if (!markInstance) { resolve(); return; } markInstance.unmark(markOptions(() => resolve())); }); }
  async function applyHighlight(quote) {
    await unmark();
    if (!markInstance || !quote) return { markedTexts: [], bodyText: bodyText() };
    return new Promise(resolve => { markInstance.mark(quote, markOptions(() => resolve({ markedTexts: marks().map(item => item.textContent), bodyText: bodyText() }))); });
  }
  function highlightNote() {
    const note = document.querySelector('#highlight-note');
    if (!highlightReady) { note.hidden = false; note.textContent = '原文高亮暂不可用。已有标注文字、笔记编辑和导出仍可继续使用。'; return; }
    if (highlightId === null) { note.hidden = true; note.textContent = ''; return; }
    const count = marks().length;
    note.hidden = false;
    note.textContent = count === 0 ? '开放材料中没有找到这段文字。'
      : `材料中 ${count} 处匹配。同一段文字多处出现时，这里只表示文本匹配，不代表原选区位置。`;
  }
  function enableHighlight() {
    if (highlightReady || typeof window.Mark !== 'function') return;
    markInstance = new window.Mark(area()); highlightReady = true; render(); highlightNote();
  }
  function render() {
    if (!state) return;
    const root = document.querySelector('#annotations'); root.replaceChildren();
    document.querySelector('#empty').hidden = state.annotations.length > 0;
    for (const item of state.annotations) {
      const section = document.createElement('section'); section.className = 'annotation';
      const quote = document.createElement('blockquote'); quote.textContent = item.quote;
      const label = document.createElement('label'); label.textContent = '标注内容';
      const input = document.createElement('textarea'); input.value = item.note; input.maxLength = 4000;
      input.setAttribute('aria-label', '标注内容'); input.readOnly = blocked || connection.readOnly;
      input.addEventListener('input', () => { setNote(item.id, input.value); });
      label.append(input); const actions = document.createElement('div'); actions.className = 'actions';
      const locate = document.createElement('button'); locate.hidden = !highlightReady;
      locate.textContent = highlightId === item.id ? '取消高亮' : '在材料中高亮';
      locate.onclick = async () => {
        if (highlightId === item.id) { highlightId = null; await unmark(); locate.textContent = '在材料中高亮'; }
        else { highlightId = item.id; await applyHighlight(item.quote); locate.textContent = '取消高亮'; }
        highlightNote();
      };
      const remove = document.createElement('button'); remove.textContent = '移除此标注'; remove.disabled = blocked || connection.readOnly;
      remove.onclick = () => { state.annotations = state.annotations.filter(other => other.id !== item.id);
        if (highlightId === item.id) { highlightId = null; void unmark().then(highlightNote); } void change(); render(); };
      actions.append(locate, remove); section.append(quote,label,actions); root.append(section);
    }
  }
  document.querySelector('#add').onclick = () => {
    const selection = getSelection(), range = selection?.rangeCount ? selection.getRangeAt(0) : null;
    if (blocked || !range || !area().contains(range.commonAncestorContainer)) return;
    if (addAnnotation(selection.toString())) document.querySelector('#annotations section:last-child textarea')?.focus();
  };
  const exportButton = document.createElement('button'); exportButton.textContent = '导出当前标注';
  exportButton.onclick = () => { request('workspace.read', {}, () => {}); const text = JSON.stringify(state,null,2);
    const output = document.createElement('textarea'); output.readOnly = true; output.value = text; output.setAttribute('aria-label','可复制的标注备份');
    document.querySelector('aside').append(output); output.select(); };
  document.querySelector('aside').append(exportButton);

  /** Re-verify every delivered byte against the manifest before executing it; the host's check is not inherited. */
  async function verifyDependency(item) {
    const manifest = connection.payload.binding.definition.manifest;
    const declared = manifest.formatVersion === 2 ? manifest.dependencies.find(entry => entry.dependencyId === item.dependencyId) : undefined;
    if (!declared) throw new Error('invalid-input');
    const bytes = Uint8Array.from(atob(item.scriptBase64), value => value.charCodeAt(0));
    if (bytes.length !== declared.byteLength) throw new Error('resource-unavailable');
    const digest = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(value => value.toString(16).padStart(2, '0')).join('');
    if (digest !== declared.sha256) throw new Error('resource-unavailable');
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }
  async function loadDependencies(list) {
    const loaded = [];
    for (const item of list) {
      const code = await verifyDependency(item);
      const before = new Set(Object.getOwnPropertyNames(window));
      const script = document.createElement('script');
      script.textContent = code;
      script.setAttribute('data-dependency', item.dependencyId);
      document.head.append(script);
      // Report what the delivered bytes really defined, not what the manifest claims.
      const globals = Object.getOwnPropertyNames(window).filter(name => !before.has(name)).slice(0, 8);
      loaded.push({ dependencyId: item.dependencyId, globals });
      loadedGlobals.set(item.dependencyId, globals);
    }
    return { kind: 'loaded', loaded };
  }
  async function runStep(step) {
    if (mode !== 'preparation') throw new Error('forbidden');
    if (step.kind === 'dependency-loads')
      return { kind: 'loaded', loaded: step.dependencyIds.map(dependencyId => ({ dependencyId, globals: loadedGlobals.get(dependencyId) ?? [] })) };
    if (step.kind === 'highlight-matches') {
      const result = await applyHighlight(step.quote);
      return { kind: 'highlight', marks: result.markedTexts.length, markedTexts: result.markedTexts, bodyText: result.bodyText };
    }
    if (step.kind === 'highlight-releases') {
      await applyHighlight(step.quote); await unmark();
      return { kind: 'highlight', marks: marks().length, markedTexts: marks().map(item => item.textContent), bodyText: bodyText() };
    }
    if (step.kind === 'annotation-roundtrip') {
      const id = addAnnotation(step.quote);
      if (!id) throw new Error('invalid-input');
      setNote(id, step.note);
      const reply = await call('workspace.read', {});
      if (reply.error) throw new Error(reply.error.code);
      const stored = reply.payload.content.annotations.find(other => other.id === id);
      return { kind: 'annotations', annotations: reply.payload.content.annotations.length, note: stored?.note ?? '', rejected: false };
    }
    if (step.kind === 'invalid-input-rejected')
      return { kind: 'annotations', annotations: state.annotations.length, note: '', rejected: addAnnotation(step.quote) === null };
    throw new Error('invalid-input');
  }
  async function resetSelfTest() {
    highlightId = null; await unmark();
    state = { annotations: [] };
    const reply = await change();
    if (reply.error) throw new Error(reply.error.code);
    render(); highlightNote();
    return { kind: 'reset', reset: true };
  }
  async function handlePreparation(message) {
    if (!connection || message.connectionId !== connection.connectionId || message.instanceId !== connection.instanceId) return;
    const reply = observation => port.postMessage({ preparationProtocolVersion:1, connectionId:connection.connectionId,
      instanceId:connection.instanceId, replyTo:message.messageId, observation });
    const fail = code => port.postMessage({ preparationProtocolVersion:1, connectionId:connection.connectionId,
      instanceId:connection.instanceId, replyTo:message.messageId, error:{ code: CODES.includes(code) ? code : 'invalid-input' } });
    if (typeof message.messageId !== 'string' || !message.request) return fail('invalid-input');
    if (!initialized) return fail('stale-connection');
    // A self-test step must not run against a view whose temporary state has not been read yet.
    if (message.request.method !== 'preparation.load' && !prepared) return fail('conflict');
    try {
      if (message.request.method === 'preparation.load') {
        const observation = await loadDependencies(message.request.payload.dependencies);
        // The self-test drives the same highlight implementation as production, so both modes enable it here.
        enableHighlight();
        reply(observation);
      } else if (message.request.method === 'preparation.reset') reply(await resetSelfTest());
      else if (message.request.method === 'preparation.step') reply(await runStep(message.request.payload.step));
      else fail('invalid-input');
    } catch (failure) { fail(failure instanceof Error ? failure.message : 'invalid-input'); }
  }
  function receive(event) {
    const message = event.data;
    if (!message || typeof message !== 'object') return;
    if (message.preparationProtocolVersion === 1) { void handlePreparation(message); return; }
    if (message.hostApiVersion !== 1) return;
    if (message.method === 'host.initialize') {
      if (connection && (connection.connectionId !== message.connectionId || connection.instanceId !== message.instanceId)) return;
      const preparation = message.payload.preparation;
      // This view declares preparationProtocolVersion=1, so it refuses a host that does not state the mode.
      if (!preparation || preparation.preparationProtocolVersion !== 1) return;
      mode = preparation.mode;
      connection = {...message, readOnly:message.payload.readOnly};
      for (const [name,value] of Object.entries(message.payload.theme)) document.documentElement.style.setProperty('--'+name,value);
      if (initialized) return; initialized = true;
      document.querySelector('#title').textContent = message.payload.binding.configuration.title;
      for (const material of message.payload.materials) {
        const heading = document.createElement('h2'); heading.textContent = material.title;
        const text = document.createElement('p'); text.textContent = material.text;
        area().append(heading,text);
      }
      if (typeof window.Mark === 'function') { markInstance = new window.Mark(area()); highlightReady = true; }
      highlightNote();
      request('workspace.read', {}, reply => {
        if (reply.error) error('原标注暂时无法读取，请保留原作品并重新打开核对。');
        else {
          state = reply.payload.content; contentId = reply.payload.contentId; prepared = true;
          render(); highlightNote(); document.querySelector('#add').disabled = connection.readOnly;
        }
        request('component.ready', {}, () => {});
      });
    } else if (connection && message.connectionId === connection.connectionId && message.instanceId === connection.instanceId && message.replyTo) {
      const callback = pending.get(message.replyTo); pending.delete(message.replyTo); callback?.(message);
    }
  }
  window.addEventListener('message', event => {
    if (event.source !== parent || event.data?.method !== 'host.initialize' || event.data.hostApiVersion !== 1 || !event.ports[0]) return;
    port?.close(); pending.clear(); initialized = false; prepared = false; connection = undefined; mode = null; highlightId = null;
    port = event.ports[0]; port.onmessage = receive; receive(event);
  });
})();
</script></body></html>
