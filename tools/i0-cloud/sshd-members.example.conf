# Install only after registering actual member public keys and allocating each node's port.
# This is a Match-only fragment. Validate the complete configuration with sshd -t before reload.
Match User REPLACE_BROWSER_TUNNEL_USER
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding local
    GatewayPorts no
    PermitOpen 127.0.0.1:REPLACE_APPLICATION_PORT
    PermitListen none
    MaxSessions 0

# Replace this account and port for each registered execution member.
Match User REPLACE_EXECUTION_TUNNEL_USER
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding remote
    GatewayPorts no
    PermitOpen none
    PermitListen 127.0.0.1:REPLACE_EXECUTION_PORT
    MaxSessions 0

Match all
